{{- if .Values.portal.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aria-core.fullname" . }}-portal
  labels:
    {{- include "aria-core.labels" . | nindent 4 }}
    {{- include "aria-core.portal.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.portal.replicaCount }}
  selector:
    matchLabels:
      {{- include "aria-core.portal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aria-core.portal.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: portal
          image: "{{ .Values.portal.image.repository }}:{{ .Values.portal.image.tag }}"
          imagePullPolicy: {{ .Values.portal.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.portal.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            {{- toYaml .Values.portal.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aria-core.fullname" . }}-portal
  labels:
    {{- include "aria-core.labels" . | nindent 4 }}
    {{- include "aria-core.portal.selectorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.portal.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "aria-core.portal.selectorLabels" . | nindent 4 }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aria-core.fullname" . }}-api
  labels:
    {{- include "aria-core.labels" . | nindent 4 }}
    {{- include "aria-core.api.selectorLabels" . | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "aria-core.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aria-core.api.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.api.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: ARIA_PORT
              value: {{ .Values.api.port | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.secretRef }}
                  key: postgres-password
            - name: ARIA_DATABASE_URL
              value: {{ include "aria-core.databaseUrl" . | quote }}
            - name: ARIA_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.secretRef }}
                  key: jwt-secret
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
